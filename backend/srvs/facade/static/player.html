<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player Client</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
    #log { background: white; border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Player Client</h1>
  <label>Session ID: <input id="sessionId" value="13"></label>
  <label>User ID: <input id="userId" value="5"></label>
  <button id="connectBtn">Connect</button>
  <h3>Messages:</h3>
  <div id="log"></div>

  <script>
    let ws;
    const logDiv = document.getElementById("log");

    function log(msg) {
      const div = document.createElement("div");
      div.textContent = msg;
      logDiv.appendChild(div);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    document.getElementById("connectBtn").onclick = () => {
      const sessionId = document.getElementById("sessionId").value.trim();
      ws = new WebSocket(`ws://localhost:8080/ws/${sessionId}/player`);
      // ws = new WebSocket(`wss://present.proslides.ir/ws/${sessionId}/player`);

      ws.onopen = () => {
          const register = {
            type: 6,
            name: prompt("Enter your name:", "ali"),
            character: "❤️"
          };
          ws.send(JSON.stringify(register));
          log("📤 Sent registration");
      };

      ws.onclose = () => log("❌ Disconnected");

      ws.onmessage = (event) => {
        log("📩 " + event.data);

        try {
          const data = JSON.parse(event.data);
          if (data.type === 10) {
              localStorage.setItem("user_id", data.user_id);
              log(`✅ Registered! User ID: ${data.user_id}`);
              localStorage.setItem("user_id", data.user_id);
              localStorage.setItem("player_name", data.name);
              localStorage.setItem("character", data.character);
          }
          if (data.type === 2) {
            // Got question, send OK immediately
            ws.send("ok");
            log("✅ Sent OK");

            // Choose random answer time
            const delay = Math.floor(Math.random() * data.question_time * 1000);
            log(`🕐 Will answer after ${delay / 1000}s`);

            setTimeout(() => {
              const answer = {
                type: 4,
                question_id: data.question_id,
                user_id: localStorage.getItem('user_id'),
                submit_time: delay / 1000,
                options_result: data.options.map(opt => ({
                  option_id: opt.option_id,
                  picked: Math.random() < 0.5 // random answer
                }))
              };
              ws.send(JSON.stringify(answer));
              log("📤 Sent answer: " + JSON.stringify(answer));
            }, delay);
          }
        } catch (e) {
          // Probably a text message like OK count
        }
      };
    };
  </script>
</body>
</html>
