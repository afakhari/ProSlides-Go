version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Baku"
    # During rapid pre-production development, keep security updates automatic
    # but avoid routine version-update PR/CI churn.
    open-pull-requests-limit: 0
    groups:
      web-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
      time: "09:15"
      timezone: "Asia/Baku"
    open-pull-requests-limit: 0
    groups:
      api-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:30"
      timezone: "Asia/Baku"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
