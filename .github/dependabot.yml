version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Baku"
    open-pull-requests-limit: 3
    groups:
      web-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
      time: "09:15"
      timezone: "Asia/Baku"
    open-pull-requests-limit: 3
    groups:
      api-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:30"
      timezone: "Asia/Baku"
    open-pull-requests-limit: 2
    groups:
      actions-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
