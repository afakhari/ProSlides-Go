name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/live

  web-fast:
    name: web-fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 60
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci

      - name: Validate canonical v2 load harness
        shell: bash
        run: |
          node --input-type=module --check < ../../load/k6/live-smoke.js
          node ../../load/k6/check-harness.mjs

      - name: Parse PowerShell integration matrix
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "../../scripts/test-auth-integration.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - run: npm run api:types:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run architecture:check
      - run: npm run dead-code:check
      - run: npm run test:unit
      - run: npm run test:component:typecheck
      - run: npm run test:component
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate local Compose
        run: docker compose --env-file apps/api/.env.example config --quiet

      - name: Validate production Compose
        env:
          API_IMAGE: example.invalid/proslides/api:test
          WEB_IMAGE: example.invalid/proslides/web:test
          DATABASE_URL: postgres://user:password@postgres.example/proslides?sslmode=require
          REDIS_URL: rediss://redis.example:6379/0
          EMAIL_VERIFICATION_PEPPER: 0123456789abcdef0123456789abcdef
          PUBLIC_WEB_URL: https://proslides.example.com
          SMTP_HOST: smtp.example.com
          SMTP_FROM_ADDRESS: no-reply@example.com
        run: docker compose --env-file deploy/.env.production.example -f deploy/compose.production.yaml config --quiet

      - name: Validate operational shell commands
        run: bash -n deploy/postgres-backup.sh deploy/postgres-restore.sh deploy/postgres-prune-live-events.sh

  browser-e2e:
    needs: containers
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select container registry
        id: registry
        shell: bash
        run: |
          set -u

          registries=(
            "docker.io/library"
            "public.ecr.aws/docker/library"
            "docker.arvancloud.ir"
          )

          images=(
            "golang:1.26-alpine"
            "alpine:3.21"
            "node:22-alpine"
            "nginx:1.27-alpine"
            "postgres:16.15-alpine"
            "redis:7.4.3-alpine"
          )

          for registry in "${registries[@]}"; do
            echo "::group::Testing $registry"
            healthy=true

            for image in "${images[@]}"; do
              echo "Pulling $registry/$image"
              if ! docker pull "$registry/$image"; then
                echo "Registry $registry failed on $image"
                healthy=false
                break
              fi
            done

            echo "::endgroup::"

            if [ "$healthy" = true ]; then
              echo "Selected registry: $registry"
              echo "registry=$registry" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Trying next registry..."
          done

          echo "::error::No container registry is currently available"
          exit 1

      - name: Build API image
        env:
          BASE_REGISTRY: ${{ steps.registry.outputs.registry }}
        run: docker compose build api

      - name: Build web image
        env:
          BASE_REGISTRY: ${{ steps.registry.outputs.registry }}
        run: docker compose build web

      - name: Start browser-test dependencies
        env:
          BASE_REGISTRY: ${{ steps.registry.outputs.registry }}
        run: docker compose up -d postgres redis api

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/readyz >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done

          echo "::error::API did not become ready"
          docker compose ps
          docker compose logs --no-color --tail=200 api postgres redis
          exit 1

      - name: Verify PostgreSQL backup and isolated restore
        shell: bash
        env:
          DATABASE_URL: postgres://proslides:proslides@postgres:5432/proslides?sslmode=disable
          RESTORE_DATABASE_URL: postgres://proslides:proslides@postgres:5432/proslides_restore?sslmode=disable
          RESTORE_CONFIRMATION: RESTORE_ISOLATED_DATABASE
          POSTGRES_CLIENT_IMAGE: ${{ steps.registry.outputs.registry }}/postgres:16.15-alpine
        run: |
          set -euo pipefail
          backup_path="$RUNNER_TEMP/proslides-restore-drill.dump"
          POSTGRES_CLIENT_NETWORK="$(docker inspect "$(docker compose ps -q postgres)" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          if [[ -z "$POSTGRES_CLIENT_NETWORK" ]]; then
            echo "::error::unable to resolve the Compose PostgreSQL network"
            exit 1
          fi
          export POSTGRES_CLIENT_NETWORK

          docker compose exec -T postgres createdb -U proslides proslides_restore
          bash deploy/postgres-backup.sh "$backup_path"

          if RESTORE_DATABASE_URL="$DATABASE_URL" bash deploy/postgres-restore.sh "$backup_path"; then
            echo "::error::restore guard accepted the active source database as its target"
            exit 1
          fi

          equivalent_source_url="${DATABASE_URL}&application_name=restore-guard-check"
          if RESTORE_DATABASE_URL="$equivalent_source_url" bash deploy/postgres-restore.sh "$backup_path"; then
            echo "::error::restore guard accepted an equivalent source database URL"
            exit 1
          fi

          bash deploy/postgres-restore.sh "$backup_path"

          source_migrations="$(docker compose exec -T postgres psql -U proslides -d proslides -Atqc 'SELECT count(*) FROM schema_migrations')"
          restored_migrations="$(docker compose exec -T postgres psql -U proslides -d proslides_restore -Atqc 'SELECT count(*) FROM schema_migrations')"
          test "$source_migrations" = "$restored_migrations"
          test "$source_migrations" -gt 0

          docker compose exec -T postgres dropdb -U proslides proslides_restore
          rm -f "$backup_path"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Generate stable visual baselines
        if: github.event_name == 'pull_request' && github.head_ref == 'test/v28-stable-visual-regression'
        working-directory: apps/web
        run: npx playwright test e2e/visual-regression.spec.js --update-snapshots

      - name: Upload stable visual baselines
        if: github.event_name == 'pull_request' && github.head_ref == 'test/v28-stable-visual-regression'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression-baselines
          path: apps/web/e2e/visual-regression.spec.js-snapshots/
          if-no-files-found: error
          retention-days: 1

      - name: Commit bootstrapped visual baselines
        if: github.event_name == 'pull_request' && github.head_ref == 'test/v28-stable-visual-regression'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshots="apps/web/e2e/visual-regression.spec.js-snapshots"
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          git add "$snapshots"
          if git diff --cached --quiet; then
            echo "Visual baselines are already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(v2.8): commit stable visual baselines"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Run browser E2E
        working-directory: apps/web
        run: npm run test:e2e

      - name: Repeat critical browser E2E
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        working-directory: apps/web
        run: npm run test:e2e:critical -- --repeat-each=2

      - name: Verify ended-session live event retention
        shell: bash
        env:
          DATABASE_URL: postgres://proslides:proslides@postgres:5432/proslides?sslmode=disable
          POSTGRES_CLIENT_IMAGE: ${{ steps.registry.outputs.registry }}/postgres:16.15-alpine
          LIVE_EVENT_RETENTION_DAYS: "30"
          LIVE_EVENT_RETENTION_BATCH_SIZE: "2"
        run: |
          set -euo pipefail
          POSTGRES_CLIENT_NETWORK="$(docker inspect "$(docker compose ps -q postgres)" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          if [[ -z "$POSTGRES_CLIENT_NETWORK" ]]; then
            echo "::error::unable to resolve the Compose PostgreSQL network"
            exit 1
          fi
          export POSTGRES_CLIENT_NETWORK

          session_id="$(docker compose exec -T postgres psql -U proslides -d proslides -Atqc "SELECT id FROM live_sessions WHERE state='ended' AND EXISTS (SELECT 1 FROM live_events WHERE session_id=live_sessions.id) ORDER BY ended_at DESC NULLS LAST LIMIT 1")"
          if [[ -z "$session_id" ]]; then
            echo "::error::browser suite did not leave an ended Session with replay events"
            exit 1
          fi

          before="$(docker compose exec -T postgres psql -U proslides -d proslides -Atqc "SELECT count(*) FROM live_events WHERE session_id='$session_id'::uuid")"
          test "$before" -gt 0

          LIVE_EVENT_RETENTION_DRY_RUN=1 bash deploy/postgres-prune-live-events.sh
          after_dry_run="$(docker compose exec -T postgres psql -U proslides -d proslides -Atqc "SELECT count(*) FROM live_events WHERE session_id='$session_id'::uuid")"
          test "$after_dry_run" = "$before"

          if LIVE_EVENT_RETENTION_DRY_RUN=0 bash deploy/postgres-prune-live-events.sh; then
            echo "::error::retention command accepted destructive mode without confirmation"
            exit 1
          fi

          LIVE_EVENT_RETENTION_DRY_RUN=0 \
          LIVE_EVENT_RETENTION_CONFIRMATION=PRUNE_ENDED_LIVE_EVENTS \
            bash deploy/postgres-prune-live-events.sh
          after_recent_prune="$(docker compose exec -T postgres psql -U proslides -d proslides -Atqc "SELECT count(*) FROM live_events WHERE session_id='$session_id'::uuid")"
          test "$after_recent_prune" = "$before"

          docker compose exec -T postgres psql -U proslides -d proslides -v ON_ERROR_STOP=1 -c "UPDATE live_sessions SET ended_at=clock_timestamp()-interval '31 days' WHERE id='$session_id'::uuid" >/dev/null

          LIVE_EVENT_RETENTION_DRY_RUN=0 \
          LIVE_EVENT_RETENTION_CONFIRMATION=PRUNE_ENDED_LIVE_EVENTS \
            bash deploy/postgres-prune-live-events.sh

          remaining="$(docker compose exec -T postgres psql -U proslides -d proslides -Atqc "SELECT count(*) FROM live_events WHERE session_id='$session_id'::uuid")"
          test "$remaining" = "0"

      - name: Print stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 api postgres redis

      - name: Stop browser-test stack
        if: always()
        run: docker compose down

  web:
    name: web
    if: always()
    needs:
      - web-fast
      - browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm web quality gates
        env:
          WEB_FAST_RESULT: ${{ needs.web-fast.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WEB_FAST_RESULT" != "success" || "$BROWSER_E2E_RESULT" != "success" ]]; then
            echo "::error::web-fast=$WEB_FAST_RESULT browser-e2e=$BROWSER_E2E_RESULT"
            exit 1
          fi
          echo "Static web checks and browser E2E passed"
