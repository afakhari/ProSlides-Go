name: Temporary V2.7 Choice compatibility verification

on:
  push:
    branches:
      - refactor/v2.7-drop-choice-response-compat

permissions:
  contents: read

concurrency:
  group: v2-7-choice-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  choice-compat-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: proslides-v27-choice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select container registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          registries=(
            "docker.io/library"
            "public.ecr.aws/docker/library"
            "docker.arvancloud.ir"
          )
          images=(
            "golang:1.26-alpine"
            "alpine:3.21"
            "postgres:16.15-alpine"
            "redis:7.4.3-alpine"
          )
          for registry in "${registries[@]}"; do
            healthy=true
            for image in "${images[@]}"; do
              if ! docker pull "$registry/$image"; then
                healthy=false
                break
              fi
            done
            if [ "$healthy" = true ]; then
              echo "registry=$registry" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No container registry is currently available"
          exit 1

      - name: Start full API stack and apply all migrations
        env:
          BASE_REGISTRY: ${{ steps.registry.outputs.registry }}
        run: docker compose --env-file apps/api/.env.example up -d --build postgres redis api

      - name: Run canonical Compose integration matrix
        shell: pwsh
        run: ./scripts/test-auth-integration.ps1 -SkipComposeStartup

      - name: Verify retained Choice event migration semantics
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file apps/api/.env.example exec -T postgres \
            psql -U proslides -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS v27_choice_migration WITH (FORCE);
          CREATE DATABASE v27_choice_migration;
          SQL

          docker compose --env-file apps/api/.env.example exec -T postgres \
            psql -U proslides -d v27_choice_migration -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE live_session_slides (
            session_id uuid NOT NULL,
            slide_id uuid NOT NULL,
            kind text NOT NULL,
            content jsonb NOT NULL
          );
          CREATE TABLE live_events (
            event_id bigserial PRIMARY KEY,
            schema_version integer NOT NULL,
            session_id uuid NOT NULL,
            name text NOT NULL,
            payload jsonb NOT NULL
          );

          INSERT INTO live_session_slides(session_id,slide_id,kind,content)
          VALUES (
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            'activity',
            '{"schema_version":3,"activity_kind":"choice"}'::jsonb
          );

          INSERT INTO live_events(schema_version,session_id,name,payload)
          VALUES (
            1,
            '11111111-1111-4111-8111-111111111111',
            'activity.result_updated',
            '{"activity_item_id":"22222222-2222-4222-8222-222222222222","response_count":7,"option_counts":{"0":4,"1":3}}'::jsonb
          );
          SQL

          docker compose --env-file apps/api/.env.example exec -T postgres \
            psql -U proslides -d v27_choice_migration -v ON_ERROR_STOP=1 \
            < apps/api/internal/platform/migrate/sql/0020_v2_canonical_activity_result_events.sql

          docker compose --env-file apps/api/.env.example exec -T postgres \
            psql -U proslides -d v27_choice_migration -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            event_schema integer;
            migrated jsonb;
          BEGIN
            SELECT schema_version,payload
            INTO event_schema,migrated
            FROM live_events
            WHERE event_id=1;

            IF event_schema <> 2 THEN
              RAISE EXCEPTION 'expected event schema 2, got %', event_schema;
            END IF;
            IF migrated->>'activity_kind' <> 'choice' THEN
              RAISE EXCEPTION 'activity_kind was not canonicalized: %', migrated;
            END IF;
            IF (migrated->>'schema_version')::int <> 3 THEN
              RAISE EXCEPTION 'activity schema version was not preserved: %', migrated;
            END IF;
            IF (migrated->>'response_count')::int <> 7 THEN
              RAISE EXCEPTION 'response_count was not preserved: %', migrated;
            END IF;
            IF migrated->'payload'->'option_counts' <> '{"0":4,"1":3}'::jsonb THEN
              RAISE EXCEPTION 'option counts were not moved into payload: %', migrated;
            END IF;
            IF migrated ? 'option_counts' THEN
              RAISE EXCEPTION 'legacy top-level option_counts survived: %', migrated;
            END IF;
          END $$;
          SQL

      - name: Print stack logs on failure
        if: failure()
        run: docker compose --env-file apps/api/.env.example logs --no-color --tail=250 api postgres redis

      - name: Stop verification stack
        if: always()
        run: docker compose --env-file apps/api/.env.example down -v
