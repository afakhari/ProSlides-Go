name: Temporary V2.7 protocol verification

on:
  push:
    branches:
      - test/v2.7-canonical-live-verification

permissions:
  contents: read

concurrency:
  group: v2-7-protocol-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: proslides-v27-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod

      - name: Select container registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          registries=(
            "docker.io/library"
            "public.ecr.aws/docker/library"
            "docker.arvancloud.ir"
          )
          images=(
            "golang:1.26-alpine"
            "alpine:3.21"
            "postgres:16.15-alpine"
            "redis:7.4.3-alpine"
          )
          for registry in "${registries[@]}"; do
            healthy=true
            for image in "${images[@]}"; do
              if ! docker pull "$registry/$image"; then
                healthy=false
                break
              fi
            done
            if [ "$healthy" = true ]; then
              echo "registry=$registry" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No container registry is currently available"
          exit 1

      - name: Start canonical API stack
        env:
          BASE_REGISTRY: ${{ steps.registry.outputs.registry }}
        run: docker compose --env-file apps/api/.env.example up -d --build postgres redis api

      - name: Run Compose integration matrix
        shell: pwsh
        run: ./scripts/test-auth-integration.ps1 -SkipComposeStartup

      - name: Build pinned SSE-enabled k6
        shell: bash
        run: |
          set -euo pipefail
          go install go.k6.io/xk6/cmd/xk6@v1.3.5
          "$(go env GOPATH)/bin/xk6" build v1.2.2 \
            --with github.com/phymbert/xk6-sse@v0.1.12 \
            --output /tmp/k6

      - name: Run canonical live protocol smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/k6 run \
            --summary-export=/tmp/live-smoke.json \
            -e BASE_URL=http://127.0.0.1:8080 \
            -e USERS=10 \
            -e CONTROLLER_DELAY=3s \
            -e ANSWER_WINDOW=5 \
            load/k6/live-smoke.js 2>&1 | tee /tmp/k6.log

          session_id="$(grep 'live_smoke_setup' /tmp/k6.log | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)"
          if [ -z "$session_id" ]; then
            echo "::error::Could not recover live_smoke_setup session_id"
            exit 1
          fi

          docker compose --env-file apps/api/.env.example exec -T postgres \
            psql -U proslides -d proslides -v ON_ERROR_STOP=1 \
            -v "session_id=$session_id" \
            -v expected_participants=10 \
            -v expected_answers=10 \
            < load/k6/reconcile.sql

      - name: Print stack logs on failure
        if: failure()
        run: docker compose --env-file apps/api/.env.example logs --no-color --tail=300 api postgres redis

      - name: Stop verification stack
        if: always()
        run: docker compose --env-file apps/api/.env.example down -v
