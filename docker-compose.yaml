version: '3.9'
services:
    redis:
        container_name: "redis"
        image: docker.arvancloud.ir/redis:7.4.3-alpine
        hostname: redis
        volumes:
            - cache:/data
        ports:
            - '127.0.0.1:6379:6379'
        command: "redis-server --save 10 1 --loglevel warning"
        restart: always

volumes:
    cache:
        driver: local
