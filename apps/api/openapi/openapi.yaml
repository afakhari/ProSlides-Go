openapi: 3.0.3
info:
  title: ProSlides API
  version: 0.1.0
  description: Contract-first API for the Go modular monolith.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness probe.
      responses:
        '200':
          description: The API process can serve requests. This endpoint does not check dependencies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: getReadiness
      summary: Required dependency readiness probe.
      responses:
        '200':
          description: PostgreSQL and Redis are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: At least one required dependency is unavailable or not configured. Driver errors and connection details are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        '200':
          description: API version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1/auth/register:
    post:
      operationId: registerAccount
      summary: Create an account and either start a session or begin email verification.
      description: When email verification is disabled, sets an HttpOnly session cookie and a readable CSRF cookie. Otherwise no session is issued until the six-digit code is verified. Passwords and verification codes are never returned or logged; OTPs are stored only as keyed hashes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created. The response states whether verification is required and whether a session was established.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: An account already uses this email address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Verification delivery is required but unavailable. }
  /api/v1/auth/login:
    post:
      operationId: loginAccount
      summary: Start an authenticated session.
      description: Sets an HttpOnly session cookie and a readable CSRF cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Credentials are valid but email verification is still required. }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/logout:
    post:
      operationId: logoutAccount
      summary: End the current authenticated session.
      description: Requires the session cookie and `X-CSRF-Token` equal to the CSRF cookie value.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Session ended, whether or not it had already expired. }
        '403': { $ref: '#/components/responses/CSRFError' }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the account represented by the current session cookie.
      responses:
        '200':
          description: Current authenticated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/verify:
    post:
      operationId: verifyAccountEmail
      summary: Activate an account with its one-time six-digit email code.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerifyEmailRequest' } } }
      responses:
        '200':
          description: Email verified and the normal session and CSRF cookies issued.
          content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/verify/resend:
    post:
      operationId: resendAccountVerification
      summary: Replace and resend an email verification code without disclosing unknown accounts.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResendVerificationRequest' } } }
      responses:
        '202':
          description: Accepted whether or not the account exists.
          content: { application/json: { schema: { $ref: '#/components/schemas/VerificationDeliveryResult' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Verification delivery is temporarily unavailable. }
  /api/v1/auth/google:
    post:
      operationId: authenticateWithGoogle
      summary: Verify a signed Google ID token and issue the normal session and CSRF cookies.
      description: The backend validates the RS256 signature against Google's JWKS, issuer, audience, expiry, and verified-email claim. Unsigned claim decoding is prohibited.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoogleAuthRequest' } } }
      responses:
        '200':
          description: Google identity accepted and session established.
          content: { application/json: { schema: { $ref: '#/components/schemas/GoogleAuthResult' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Google authentication is not configured or its public keys are unavailable. }
  /api/v1/auth/password/reset:
    post:
      operationId: requestPasswordReset
      summary: Send a one-time password reset link without disclosing account existence.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } }
      responses:
        '202': { description: Request accepted whether or not the email exists. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Password reset delivery is temporarily unavailable. }
  /api/v1/auth/password/reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Consume a one-time reset token and revoke all existing account sessions.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' } } }
      responses:
        '204': { description: Password changed and existing sessions revoked. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/presentations/{presentationId}:
    get:
      operationId: getPresentation
      summary: Return one presentation and its ordered slides for its owner.
      description: Requires the current authenticated session. Returns 404 when the presentation does not exist or is not owned by the current account, so identifiers are not disclosed.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
      responses:
        '200':
          description: The presentation with slides ordered by ascending position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Presentation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updatePresentation
      summary: Atomically update an owned presentation's title or visual settings.
      description: Settings are merged by key. Clients should send the last observed revision in If-Match; a stale revision returns 409 without overwriting newer edits.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RevisionMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePresentationRequest' } } }
      responses:
        '200': { description: Updated presentation., content: { application/json: { schema: { $ref: '#/components/schemas/Presentation' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EditConflict' }
    delete:
      operationId: deletePresentation
      summary: Permanently delete an owned presentation and its dependent data.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Presentation deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The presentation has a non-ended live session and cannot be deleted. }
  /api/v1/presentations/{presentationId}/access-code:
    put:
      operationId: setPresentationAccessCode
      summary: Set the public access code for an owned presentation.
      description: Normalizes the code to uppercase and updates any non-ended live session for this presentation atomically, immediately invalidating its previous public link. Codes are globally unique without regard to case.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetAccessCodeRequest' } } }
      responses:
        '200': { description: Access code saved., content: { application/json: { schema: { $ref: '#/components/schemas/AccessCodeResult' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The access code is already assigned to another presentation. }
  /api/v1/presentations:
    get:
      operationId: listPresentations
      summary: List the current owner's presentations in stable recent-first order.
      responses:
        '200':
          description: Bounded owner presentation list.
          content: { application/json: { schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/PresentationSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createPresentation
      summary: Create an empty presentation owned by the current account.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePresentationRequest' }
      responses:
        '201':
          description: Presentation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Presentation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
  /api/v1/presentations/{presentationId}/duplicate:
    post:
      operationId: duplicatePresentation
      summary: Atomically duplicate an owned presentation and all ordered slides.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePresentationRequest' } } }
      responses:
        '201': { description: Duplicated presentation., content: { application/json: { schema: { $ref: '#/components/schemas/Presentation' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/presentations/{presentationId}/latest-session:
    get:
      operationId: getLatestPresentationSession
      summary: Resolve the newest live session for an owned presentation.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
      responses:
        '200': { description: Latest session locator., content: { application/json: { schema: { $ref: '#/components/schemas/LiveSessionLocator' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/presentations/{presentationId}/sessions/{sessionId}/questions/{slideId}/results:
    get:
      operationId: getQuestionResults
      summary: Return persisted option counts and a stable bounded per-question leaderboard for an owned session.
      description: This is the Go-native replacement for Django's Rust result-ingestion endpoints. Results are derived from durable answers and never accept a second externally supplied score ledger.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - $ref: '#/components/parameters/SessionId'
        - { name: slideId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/RosterLimit'
        - $ref: '#/components/parameters/RosterCursor'
      responses:
        '200':
          description: Question results for the requested owned live session.
          content: { application/json: { schema: { $ref: '#/components/schemas/QuestionResultsPage' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/presentations/{presentationId}/results:
    delete:
      operationId: deletePresentationResults
      summary: Delete all live sessions and results for an owned presentation while preserving its content.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Results deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Results cannot be reset while the presentation has a non-ended live session. }
  /api/v1/presentations/{presentationId}/slides:
    post:
      operationId: createSlide
      summary: Add a slide to an owned presentation.
      description: Requires an authenticated owner and a CSRF token. Inserting at an occupied zero-based position atomically shifts following slides. Returns 404 for absent or non-owned presentations.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RevisionMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSlideRequest' }
      responses:
        '201':
          description: Slide created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slide' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EditConflict' }
  /api/v1/presentations/{presentationId}/slides/reorder:
    post:
      operationId: reorderSlides
      summary: Atomically replace the complete slide order for an owned presentation.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RevisionMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReorderSlidesRequest' } } }
      responses:
        '204': { description: Slide positions updated. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EditConflict' }
  /api/v1/presentations/{presentationId}/slides/{slideId}:
    put:
      operationId: replaceSlide
      summary: Replace the editable definition of one owned slide.
      description: Moving to an occupied zero-based position atomically compacts the other positions. A slide with durable answers may be moved, but its question definition cannot change until presentation results are reset.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - { name: slideId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RevisionMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSlideRequest' } } }
      responses:
        '200': { description: Replaced slide., content: { application/json: { schema: { $ref: '#/components/schemas/Slide' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The requested edit would change a slide with durable live answers. }
    delete:
      operationId: deleteSlide
      summary: Delete one owned slide and compact following positions.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - { name: slideId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RevisionMatch'
      responses:
        '204': { description: Slide deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The slide has durable live answers; reset presentation results before deleting it. }
  /api/v1/presentations/{presentationId}/questions:
    post:
      operationId: createQuestionSlide
      summary: Add a single- or multiple-choice question slide.
      parameters:
        - $ref: '#/components/parameters/PresentationId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuestionRequest' }
      responses:
        '201': { description: Question slide created. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/live/sessions/{sessionId}/events:
    get:
      operationId: subscribeLiveSession
      summary: Subscribe to server-sent live events.
      description: Requires either the manager session cookie or participant cookie. Replays events after Last-Event-ID and sends heartbeats. event_id orders delivery; state_version prevents state regressions, but aggregate events with a newer event_id may share the same state_version and must still be applied.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: >-
            Versioned text/event-stream. Each data field is a LiveEventEnvelope.
            Event names are session.created, presence.updated,
            session.state_changed, answer.stats, and leaderboard.updated.
            answer.stats is emitted once when a question closes and
            leaderboard.updated is emitted when the leaderboard is shown;
            individual answers and complete leaderboard rows are never
            broadcast. Managers fetch rows from the paginated roster endpoint.
          content:
            text/event-stream:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Viewer reconnect rate exceeded; Retry-After is returned. }
  /api/v1/live/sessions/{sessionId}/answers:
    post:
      operationId: submitLiveAnswer
      summary: Submit one idempotent answer while the question is open.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerRequest' }
      responses:
        '201':
          description: Answer accepted and scored.
          content: { application/json: { schema: { $ref: '#/components/schemas/AnswerResult' } } }
        '200':
          description: Duplicate request; returns the original result.
          content: { application/json: { schema: { $ref: '#/components/schemas/AnswerResult' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Question is not open, has expired, or was already answered. }
        '429': { description: Participant or session answer rate exceeded; Retry-After is returned. }
  /api/v1/live/sessions:
    post:
      operationId: createLiveSession
      summary: Create an idempotent draft live session for an owned presentation.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateLiveSessionRequest' } } }
      responses:
        '201': { description: Session created, content: { application/json: { schema: { $ref: '#/components/schemas/LiveSession' } } } }
        '200': { description: Duplicate request or an already-active run for this presentation; returns the resumable session without creating another run. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/live/sessions/resolve:
    get:
      operationId: resolveLiveSession
      summary: Resolve a public join code to its active live session.
      parameters:
        - name: join_code
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        '200':
          description: Active live session locator.
          content: { application/json: { schema: { $ref: '#/components/schemas/LiveSessionLocator' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/live/sessions/{sessionId}/join:
    post:
      operationId: joinLiveSession
      summary: Join a started live session and establish an HttpOnly participant cookie.
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JoinLiveSessionRequest' } } }
      responses:
        '201': { description: Participant joined, content: { application/json: { schema: { $ref: '#/components/schemas/Participant' } } } }
        '200': { description: Duplicate request; returns the original participant. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Session is not joinable or the display name is already in use. Error code display_name_taken distinguishes the latter. }
        '429': { description: Session join rate exceeded; Retry-After is returned. }
  /api/v1/live/sessions/{sessionId}/actions:
    post:
      operationId: applyLiveAction
      summary: Apply an idempotent manager state transition.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LiveActionRequest' } } }
      responses:
        '201': { description: Transition applied, content: { application/json: { schema: { $ref: '#/components/schemas/LiveSession' } } } }
        '200': { description: Duplicate request; returns the original result. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CSRFError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: State version or transition conflict. }
        '429': { description: Manager action rate exceeded; Retry-After is returned. }
  /api/v1/live/sessions/{sessionId}/snapshot:
    get:
      operationId: getLiveSnapshot
      summary: Get an authoritative role-scoped session snapshot and SSE recovery cursor.
      description: >-
        Clients apply this snapshot first, then connect to events using
        last_event_id as Last-Event-ID. Participants receive only public
        session state, their own participant record and score, aggregate
        participant count, and the active slide. Managers receive session
        state and aggregate count; roster and leaderboard rows are available
        only from the paginated manager endpoint.
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Current snapshot scoped to the authenticated viewer role.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ParticipantLiveSnapshot' }
                  - { $ref: '#/components/schemas/ManagerLiveSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/live/sessions/{sessionId}/roster:
    get:
      operationId: listLiveRoster
      summary: List a live session roster or leaderboard page as the manager.
      description: >-
        Manager-only keyset pagination. joined orders by joined_at ascending
        then participant id; score orders by score descending, joined_at
        ascending, then participant id. Cursors are opaque and bound to the
        selected order.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/RosterLimit'
        - $ref: '#/components/parameters/RosterCursor'
        - $ref: '#/components/parameters/RosterOrder'
      responses:
        '200':
          description: A stable, bounded roster page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosterPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RosterLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    RosterCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the preceding page.
      schema: { type: string, maxLength: 512 }
    RosterOrder:
      name: order
      in: query
      required: false
      schema: { type: string, enum: [joined, score], default: joined }
    PresentationId:
      name: presentationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionMatch:
      name: If-Match
      in: header
      required: false
      description: Last observed positive integer revision. When supplied, a stale value returns 409 rather than overwriting a newer edit.
      schema: { type: integer, format: int64, minimum: 1 }
  schemas:
    RegisterRequest:
      type: object
      required: [email, display_name, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, maxLength: 128 }
    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    VerificationDeliveryResult:
      type: object
      required: [detail, resend_seconds, code_expires_in_seconds]
      properties:
        detail: { type: string }
        resend_seconds: { type: integer, minimum: 0 }
        code_expires_in_seconds: { type: integer, minimum: 0 }
    GoogleAuthRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 64, maxLength: 16384 }
    GoogleAuthResult:
      allOf:
        - { $ref: '#/components/schemas/CurrentUser' }
        - type: object
          required: [needs_password_setup, is_new_user]
          properties:
            name: { type: string }
            full_name: { type: string }
            needs_password_setup: { type: boolean }
            is_new_user: { type: boolean }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    PasswordResetConfirmRequest:
      type: object
      required: [uid, token, new_password]
      properties:
        uid: { type: string, format: uuid }
        token: { type: string, minLength: 32, maxLength: 128 }
        new_password: { type: string, format: password, minLength: 12, maxLength: 128 }
    RegistrationResult:
      allOf:
        - { $ref: '#/components/schemas/CurrentUser' }
        - type: object
          required: [verification_sent]
          properties:
            verification_sent: { type: boolean }
            resend_seconds: { type: integer, minimum: 0 }
            code_expires_in_seconds: { type: integer, minimum: 0 }
    CurrentUser:
      type: object
      required: [id, email, display_name, is_active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        is_active: { type: boolean }
    Presentation:
      type: object
      required: [id, revision, title, access_code, settings, created_at, updated_at, slides]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 500 }
        access_code: { type: string, pattern: '^[A-Z0-9]{5,12}$', nullable: true }
        settings: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        slides:
          type: array
          items: { $ref: '#/components/schemas/Slide' }
    PresentationSummary:
      type: object
      required: [id, revision, title, access_code, settings, slide_count, participant_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        title: { type: string }
        access_code: { type: string, pattern: '^[A-Z0-9]{5,12}$', nullable: true }
        settings: { type: object, additionalProperties: true }
        slide_count: { type: integer, minimum: 0 }
        participant_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreatePresentationRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        settings: { type: object, additionalProperties: true }
    UpdatePresentationRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        settings: { type: object, additionalProperties: true }
    SetAccessCodeRequest:
      type: object
      required: [access_code]
      additionalProperties: false
      properties:
        access_code: { type: string, pattern: '^[A-Za-z0-9]{5,12}$' }
    AccessCodeResult:
      type: object
      required: [access_code]
      additionalProperties: false
      properties:
        access_code: { type: string, pattern: '^[A-Z0-9]{5,12}$' }
    CreateSlideRequest:
      type: object
      required: [position, kind, content]
      properties:
        position: { type: integer, minimum: 0 }
        kind: { type: string, enum: [question_draft, question, content, leaderboard] }
        content: { $ref: '#/components/schemas/EditableSlideContent' }
    ReorderSlidesRequest:
      type: object
      required: [slide_ids]
      properties:
        slide_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string, format: uuid }
    CreateQuestionRequest:
      type: object
      required: [position, text, question_type, options]
      properties:
        position: { type: integer, minimum: 0 }
        text: { type: string, minLength: 1 }
        question_type: { type: string, enum: [single, multiple] }
        question_time: { type: integer, minimum: 1, maximum: 86400, default: 30 }
        max_point: { type: integer, minimum: 1, default: 100 }
        min_point: { type: integer, minimum: 0, default: 0 }
        faster_answers_more_points: { type: boolean, default: false }
        partial_scoring:
          type: boolean
          default: false
          description: When true, score is max(0, correct selections minus incorrect selections) divided by the number of correct options; the scoring policy is an implementation boundary and may be replaced later.
        options:
          type: array
          minItems: 2
          items:
            type: object
            required: [text, is_correct]
            properties:
              text: { type: string, minLength: 1 }
              is_correct: { type: boolean }
    EditableSlideContent:
      description: Content is validated against the accompanying slide kind. Unknown fields are rejected by the API.
      anyOf:
        - $ref: '#/components/schemas/QuestionDraftContent'
        - $ref: '#/components/schemas/QuestionContent'
        - $ref: '#/components/schemas/ContentSlideContent'
        - $ref: '#/components/schemas/LeaderboardContent'
    QuestionDraftContent:
      type: object
      additionalProperties: false
      properties:
        show_leaderboard_after: { type: boolean, default: false }
    QuestionContent:
      type: object
      additionalProperties: false
      required: [text, question_type, question_time, min_point, max_point, faster_answers_more_points, partial_scoring, show_leaderboard_after, options]
      properties:
        title: { type: string, maxLength: 500 }
        text: { type: string, minLength: 1, maxLength: 10000 }
        question_type: { type: string, enum: [single, multiple] }
        question_time: { type: integer, minimum: 1, maximum: 86400 }
        min_point: { type: integer, minimum: 0 }
        max_point: { type: integer, minimum: 1 }
        image_url: { type: string, maxLength: 4096 }
        faster_answers_more_points: { type: boolean }
        partial_scoring: { type: boolean }
        show_leaderboard_after: { type: boolean }
        options:
          type: array
          minItems: 2
          maxItems: 100
          items: { $ref: '#/components/schemas/QuestionOptionDefinition' }
    QuestionOptionDefinition:
      type: object
      additionalProperties: false
      required: [id, text, is_correct, image_url, order]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        text: { type: string, minLength: 1, maxLength: 2000 }
        is_correct: { type: boolean }
        image_url: { type: string, maxLength: 4096 }
        order: { type: integer, minimum: 1 }
    ContentSlideContent:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one of title, text, or image_url must be non-empty.
      properties:
        title: { type: string, maxLength: 500 }
        text: { type: string, maxLength: 20000 }
        image_url: { type: string, maxLength: 4096 }
    LeaderboardContent:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 500 }
    AnswerRequest:
      type: object
      required: [request_id, question_slide_id, selected_option_indexes]
      properties:
        request_id: { type: string, format: uuid }
        question_slide_id: { type: string, format: uuid }
        selected_option_indexes:
          type: array
          items: { type: integer, minimum: 0 }
    CreateLiveSessionRequest:
      type: object
      required: [request_id, presentation_id]
      properties:
        request_id: { type: string, format: uuid }
        presentation_id: { type: string, format: uuid }
    JoinLiveSessionRequest:
      type: object
      required: [request_id, display_name]
      properties:
        request_id: { type: string, format: uuid, description: Also acts as the opaque participant credential and must be generated securely. }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, maxLength: 100 }
    LiveActionRequest:
      type: object
      required: [request_id, expected_state_version, action]
      properties:
        request_id: { type: string, format: uuid }
        expected_state_version: { type: integer, minimum: 1 }
        action: { type: string, enum: [start, open_content, open_question, close_question, show_leaderboard, end] }
        slide_id: { type: string, format: uuid }
        duration_seconds: { type: integer, minimum: 1, maximum: 86400 }
    LiveSession:
      type: object
      required: [id, presentation_id, host_id, join_code, state, state_version]
      properties:
        id: { type: string, format: uuid }
        presentation_id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        join_code: { type: string, pattern: '^[A-Z0-9]{5,12}$' }
        state: { type: string, enum: [draft, lobby, content, question_open, question_closed, leaderboard, ended] }
        state_version: { type: integer }
        active_slide_id: { type: string, format: uuid, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
    Participant:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        avatar: { type: string }
    AnswerResult:
      type: object
      required: [answer_id, score_delta, duplicate]
      properties:
        answer_id: { type: string, format: uuid }
        score_delta: { type: integer, minimum: 0 }
        duplicate: { type: boolean }
    PublicLiveSession:
      type: object
      required: [id, presentation_id, state, state_version]
      properties:
        id: { type: string, format: uuid }
        presentation_id: { type: string, format: uuid }
        state: { type: string, enum: [draft, lobby, content, question_open, question_closed, leaderboard, ended] }
        state_version: { type: integer, format: int64 }
        active_slide_id: { type: string, format: uuid, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
    ParticipantWithScore:
      type: object
      required: [id, display_name, score]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        avatar: { type: string }
        score: { type: integer, minimum: 0 }
        rank: { type: integer, minimum: 1, description: Present for participant snapshots in leaderboard or ended state. }
    LiveSessionLocator:
      type: object
      required: [session_id, presentation_id, presentation]
      additionalProperties: false
      properties:
        session_id: { type: string, format: uuid }
        presentation_id: { type: string, format: uuid }
        presentation:
          $ref: '#/components/schemas/PublicLivePresentation'
    PublicLivePresentation:
      type: object
      required: [title, background_color, background_image_url, text_color]
      additionalProperties: false
      description: Public, display-only presentation metadata safe for participant theming.
      properties:
        title: { type: string }
        background_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        background_image_url: { type: string }
        text_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    ParticipantLiveSnapshot:
      type: object
      required: [role, session, participant, participant_count, last_event_id]
      additionalProperties: false
      properties:
        role: { type: string, enum: [participant] }
        session: { $ref: '#/components/schemas/PublicLiveSession' }
        active_slide:
          type: object
          additionalProperties: true
          description: Active slide projected for the participant; correctness metadata such as option is_correct flags is omitted.
        participant: { $ref: '#/components/schemas/ParticipantWithScore' }
        participant_count: { type: integer, minimum: 0 }
        last_event_id: { type: integer, format: int64, minimum: 0 }
        question_stats: { $ref: '#/components/schemas/AnswerStatsPayload' }
    ManagerLiveSnapshot:
      type: object
      required: [role, session, participant_count, last_event_id]
      additionalProperties: false
      properties:
        role: { type: string, enum: [manager] }
        session: { $ref: '#/components/schemas/LiveSession' }
        active_slide: { type: object, additionalProperties: true }
        participant_count: { type: integer, minimum: 0 }
        last_event_id: { type: integer, format: int64, minimum: 0 }
        question_stats: { $ref: '#/components/schemas/AnswerStatsPayload' }
    RosterEntry:
      type: object
      required: [participant_id, display_name, score, joined_at]
      additionalProperties: false
      properties:
        participant_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar: { type: string }
        score: { type: integer, minimum: 0 }
        joined_at: { type: string, format: date-time }
    RosterPage:
      type: object
      required: [items, order, limit, has_more]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RosterEntry' }
        order: { type: string, enum: [joined, score] }
        limit: { type: integer, minimum: 1, maximum: 100 }
        has_more: { type: boolean }
        next_cursor: { type: string, nullable: true }
    QuestionOptionResult:
      type: object
      required: [option_index, option_id, option_text, is_correct, number_of_submits]
      additionalProperties: false
      properties:
        option_index: { type: integer, minimum: 0 }
        option_id: { type: string }
        option_text: { type: string }
        is_correct: { type: boolean }
        number_of_submits: { type: integer, minimum: 0 }
    QuestionLeaderboardEntry:
      type: object
      required: [participant_id, display_name, score, rank, submitted_at]
      additionalProperties: false
      properties:
        participant_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar: { type: string }
        score: { type: integer, minimum: 0 }
        rank: { type: integer, minimum: 1 }
        time_taken_ms: { type: integer, minimum: 0, nullable: true }
        submitted_at: { type: string, format: date-time }
    QuestionResultsPage:
      type: object
      required: [session_id, question_slide_id, response_count, options, leaderboard, limit, has_more]
      additionalProperties: false
      properties:
        session_id: { type: string, format: uuid }
        question_slide_id: { type: string, format: uuid }
        response_count: { type: integer, minimum: 0 }
        options:
          type: array
          items: { $ref: '#/components/schemas/QuestionOptionResult' }
        leaderboard:
          type: array
          items: { $ref: '#/components/schemas/QuestionLeaderboardEntry' }
        limit: { type: integer, minimum: 1, maximum: 100 }
        has_more: { type: boolean }
        next_cursor: { type: string, nullable: true }
    LiveEventEnvelope:
      type: object
      required: [event_id, schema_version, session_id, state_version, name, payload, occurred_at]
      properties:
        event_id: { type: integer, format: int64 }
        schema_version:
          type: integer
          enum: [1, 2]
          description: Version 2 is used by aggregate-only leaderboard.updated payloads; other current events remain version 1.
        session_id: { type: string, format: uuid }
        state_version: { type: integer, format: int64 }
        name:
          type: string
          enum: [session.created, presence.updated, session.state_changed, answer.stats, leaderboard.updated]
        payload:
          oneOf:
            - { $ref: '#/components/schemas/SessionEventPayload' }
            - { $ref: '#/components/schemas/PresenceUpdatedPayload' }
            - { $ref: '#/components/schemas/AnswerStatsPayload' }
            - { $ref: '#/components/schemas/LeaderboardUpdatedPayload' }
        occurred_at: { type: string, format: date-time }
    SessionEventPayload:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: { type: string, enum: [draft, lobby, content, question_open, question_closed, leaderboard, ended] }
        active_slide_id: { type: string, format: uuid, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        reason: { type: string, enum: [deadline_elapsed], description: Present only for an automatic server-deadline transition. }
    PresenceUpdatedPayload:
      type: object
      required: [participant_delta]
      additionalProperties: false
      properties:
        participant_delta: { type: integer, minimum: 1, description: Number of committed joins compacted into this event. Apply it to the authoritative participant_count from the latest snapshot. }
    AnswerStatsPayload:
      type: object
      required: [question_slide_id, response_count, option_counts]
      additionalProperties: false
      properties:
        question_slide_id: { type: string, format: uuid }
        response_count: { type: integer, minimum: 0 }
        option_counts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
    LeaderboardUpdatedPayload:
      type: object
      required: [participant_count]
      additionalProperties: false
      properties:
        participant_count: { type: integer, minimum: 0 }
    Slide:
      type: object
      required: [id, revision, position, kind, content]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        position: { type: integer, minimum: 0 }
        kind: { type: string, minLength: 1, maxLength: 100 }
        content:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Readiness:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    Version:
      type: object
      required: [service, environment, api_version]
      properties:
        service: { type: string }
        environment: { type: string }
        api_version: { type: string }
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid current session exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CSRFError:
      description: The CSRF header and cookie do not match a valid current session.
      content:
        application/json:
              schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The requested resource does not exist or is not visible to the current account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: The bounded authentication request budget was exceeded.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EditConflict:
      description: The resource changed after the client loaded it; reload the latest representation before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
